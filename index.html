<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untukmu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff0f3;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Poppins',sans-serif;overflow:hidden}
  #container{position:relative;width:340px;height:520px;cursor:pointer}
  /* SVG ENVELOPE */
  #envelope{width:100%;height:100%;transition:transform 0.8s cubic-bezier(0.34,1.56,0.64,1);filter:drop-shadow(0 20px 30px rgba(0,0,0,0.15))}
  #envelope.open{transform:translateY(100px) scale(0.9);opacity:0;pointer-events:none}
  #flap{transform-origin:50% 0%;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1); }
  #envelope.open #flap{transform:rotateX(180deg)}
  
  #letter{position:absolute;top:50%;left:50%;width:90%;background:white;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.15);transform:translate(-50%,-50%) scale(0.5) translateY(100px);opacity:0;transition:all 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.3s;pointer-events:none}
  #letter.show{transform:translate(-50%,-50%) scale(1) translateY(0);opacity:1;pointer-events:auto}
  h1{font-size:22px;text-align:center;color:#ff4d6d;user-select:none}
  h1:active{transform:scale(0.95)}
  #hearts{font-size:40px;text-align:center;margin:16px 0;cursor:pointer;transition:transform 0.15s}
  #hearts:active{transform:scale(1.3)}
  .hidden{display:none}
</style>
</head>
<body>
<audio id="music" src="sounds/music.mp3" loop></audio>
<audio id="boom" src="sounds/boom.mp3"></audio>

<div id="container">
  <!-- SVG ENVELOPE SMOOTH -->
  <svg id="envelope" viewBox="0 0 340 480" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="100" width="300" height="200" rx="12" fill="#ff8fa3"/>
    <path id="flap" d="M20 112 Q170 250 320 112 Q320 100 308 100 L32 100 Q20 100 20 112Z" fill="#ff4d6d"/>
    <text x="170" y="210" text-anchor="middle" font-size="48">💌</text>
    <text x="170" y="240" text-anchor="middle" font-size="14" fill="white" font-weight="600">Tap untuk buka</text>
  </svg>

  <div id="letter">
    <h1 id="title">Untuk Sayangku 💖</h1>
    <p style="margin-top:12px;line-height:1.6;text-align:center">Aku bikin ini khusus buat kamu. Tap hatinya 7x ya...</p>
    <div id="hearts">❤️</div>
    <p id="count" style="text-align:center;opacity:0.5">0 / 7</p>
    <div id="secret" class="hidden" style="margin-top:16px;text-align:center;color:#ff4d6d;font-weight:700">Kamu ngetik "sayang" 💕 Aku sayang kamu lebih!</div>
  </div>
</div>

<script>
  const env = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const music = document.getElementById('music');
  const boom = document.getElementById('boom');
  const hearts = document.getElementById('hearts');
  const countEl = document.getElementById('count');
  const title = document.getElementById('title');
  const secret = document.getElementById('secret');
  let count = 0;
  let tapTitle = 0;

  env.addEventListener('click',()=>{
    env.classList.add('open');
    letter.classList.add('show');
    music.play().catch(()=>{});
  });

  hearts.addEventListener('click',()=>{
    count++;
    countEl.textContent = count + ' / 7';
    hearts.style.transform = 'scale(1.4)';
    setTimeout(()=>hearts.style.transform='scale(1)',120);
    if(count>=7){
      boom.play().catch(()=>{});
      hearts.textContent='💥';
      setTimeout(()=>{hearts.textContent='💖💖💖';},600);
    }
  });

  // Easter egg sayang - HP friendly: tap judul 3x
  title.addEventListener('click',()=>{
    tapTitle++;
    if(tapTitle>=3){ showSecret(); tapTitle=0; }
    setTimeout(()=>{if(tapTitle>0 && tapTitle<3) tapTitle=0},1500);
  });

  // Tetap support keyboard fisik juga
  let buffer='';
  window.addEventListener('keydown',(e)=>{
    buffer+=e.key.toLowerCase();
    if(buffer.includes('sayang')){ showSecret(); buffer=''; }
    if(buffer.length>10) buffer=buffer.slice(-10);
  });

  function showSecret(){
    secret.classList.remove('hidden');
    secret.animate([{transform:'scale(0.5)',opacity:0},{transform:'scale(1.2)',opacity:1},{transform:'scale(1)',opacity:1}],{duration:600,easing:'cubic-bezier(0.34,1.56,0.64,1)'});
  }
</script>
</body>
</html>
